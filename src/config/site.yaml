whatsapp: ""

instagram: https://www.instagram.com/ruca_nails/
instagramHandle: "@ruca_nails"
email: ""            # optional, shown on the contact page when filled in

currency: "₹"

# Thin bar at the top of every page. Leave blank ("") to hide it.
