howItWorks:
  - title: Browse styles
    text: Explore ready-made sets or ask for something custom.
  - title: Pick your set
    text: Choose the shape, length and size that suit you.
  - title: Message us
    text: Order on WhatsApp or Instagram. No sign-up needed.
  - title: Apply and slay
    text: Local delivery in 1–2 days, with a free prep kit.

# Filter options shown on the shop page
filters:
  shapes: [almond, squoval, coffin, square, stiletto, oval]
